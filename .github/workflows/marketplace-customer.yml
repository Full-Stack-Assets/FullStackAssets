name: Marketplace Customer

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install marketplace API dependencies
        working-directory: apps/marketplace-api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Expose app dependencies to repository tests
        run: ln -s apps/marketplace-api/node_modules node_modules
      - name: Run full Unit 1-4 verification
        run: node --test tests/*.test.mjs tests/marketplace/canon/*.test.mjs tests/marketplace/core/*.test.mjs tests/marketplace/catalog/*.test.mjs tests/marketplace/api/*.test.mjs tests/marketplace/customer/*.test.mjs
      - name: Preserve generated package lock for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-api-package-lock
          path: apps/marketplace-api/package-lock.json
          retention-days: 1
