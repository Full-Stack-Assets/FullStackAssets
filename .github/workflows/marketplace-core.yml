name: Marketplace Core

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Canon and Core suites
        run: node --test tests/marketplace/canon/*.test.mjs tests/marketplace/core/*.test.mjs
      - name: Run repository tests with marketplace suites
        run: node --test tests/*.test.mjs tests/marketplace/canon/*.test.mjs tests/marketplace/core/*.test.mjs
