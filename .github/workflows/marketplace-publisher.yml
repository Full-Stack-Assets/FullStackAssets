name: Marketplace Publisher
on: [pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install locked marketplace API dependencies
        working-directory: apps/marketplace-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ln -s apps/marketplace-api/node_modules node_modules
      - name: Run Unit 1-5 verification
        run: node --test tests/*.test.mjs tests/marketplace/canon/*.test.mjs tests/marketplace/core/*.test.mjs tests/marketplace/catalog/*.test.mjs tests/marketplace/api/*.test.mjs tests/marketplace/customer/*.test.mjs tests/marketplace/publisher/*.test.mjs tests/marketplace/distribution/*.test.mjs
