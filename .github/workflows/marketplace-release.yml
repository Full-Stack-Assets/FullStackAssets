name: Marketplace Release
on: [pull_request]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Generate Unit 6 dependency lock
        working-directory: apps/marketplace-api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Expose app dependencies
        run: ln -s apps/marketplace-api/node_modules node_modules
      - name: Run full Unit 1-6 verification
        run: node --test tests/*.test.mjs tests/marketplace/canon/*.test.mjs tests/marketplace/core/*.test.mjs tests/marketplace/catalog/*.test.mjs tests/marketplace/api/*.test.mjs tests/marketplace/customer/*.test.mjs tests/marketplace/publisher/*.test.mjs tests/marketplace/distribution/*.test.mjs tests/marketplace/commerce/*.test.mjs tests/marketplace/security/*.test.mjs tests/marketplace/operations/*.test.mjs tests/marketplace/release/*.test.mjs
      - name: Verify ten-gate release fixture
        run: node marketplace/bin/verify-marketplace-release.mjs --fixture tests/fixtures/release/pass.json
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-api-unit6-package-lock
          path: apps/marketplace-api/package-lock.json
          retention-days: 1
