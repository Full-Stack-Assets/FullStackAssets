name: TaskFlow Runtime CI

on:
  push:
    paths:
      - 'products/taskflow/**'
      - '.github/workflows/taskflow-ci.yml'
  pull_request:
    paths:
      - 'products/taskflow/**'
      - '.github/workflows/taskflow-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/taskflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/taskflow/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
