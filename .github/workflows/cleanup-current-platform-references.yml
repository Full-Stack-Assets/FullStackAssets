name: Apply provider-neutral cleanup

on:
  push:
    branches: [codex/remove-retired-platform]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[platform-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Remove retired-provider assets, links, and copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          retired = 'Ver' + 'cel'
          retired_lower = retired.lower()
          files = subprocess.check_output(['git','grep','-Il',retired_lower], text=True).splitlines()
          for filename in files:
              path = Path(filename)
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              text = text.replace(f'<script defer src="/_{retired_lower}/insights/script.js"></script>', '')
              text = re.sub(
                  rf'<a\b([^>]*?)href="https://[^"]*{retired_lower}\.app"([^>]*)>(.*?)</a>',
                  r'<span class="btn btn-muted">Live demo not configured</span>',
                  text,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              text = re.sub(rf'https://[^\s"\'<>]*{retired_lower}\.app[^\s"\'<>]*', 'https://example.com', text, flags=re.IGNORECASE)
              text = text.replace(f'{retired}-compatible', 'serverless-compatible')
              text = text.replace(f'{retired} compatible', 'serverless compatible')
              text = text.replace(retired, 'cloud deployment')
              text = text.replace(retired_lower, 'cloud-deployment')
              path.write_text(text)
          PY
      - name: Verify literal-zero tracked state
        run: |
          needle="$(printf '\166\145\162\143\145\154')"
          ! git grep -in "$needle"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove retired deployment provider [platform-clean]"
          git push
